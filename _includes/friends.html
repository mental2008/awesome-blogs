{% if site.friends %}
{% assign current_lang = page.lang | default: 'zh' %}
{% assign strings = site.data.i18n[current_lang] %}
<hr>
<h5>{{ strings.friends }}</h5>
<ul class="list-inline">
  {% for friend in site.friends %}
  <li><a href="{{friend.href}}">{{friend.title}}</a></li>
  {% endfor %}
</ul>
{% endif %}
